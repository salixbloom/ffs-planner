<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>FFS Face Planner</title>

    <!-- No build step: dependencies resolve through this import map. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs"
        }
      }
    </script>

    <style>
      :root {
        --bg: #0b0d10;
        --fg: #e8eaed;
        --muted: #9aa4b2;
        --accent: #5b9cff;
        --bad: #ff6b6b;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        overscroll-behavior: none;
      }

      /* Column layout so the panel takes space from the viewer rather than
         covering it — handles near the chin have to stay reachable. dvh keeps
         it correct while mobile browser chrome slides in and out. */
      body {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }

      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }

      /* Camera feed sits behind the WebGL canvas; the canvas is transparent so
         M1 can draw the face mesh registered on top of the video. */
      #feed, #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #feed {
        object-fit: cover;
        transform: scaleX(-1); /* selfie view */
        background: #000;
      }

      #gl { touch-action: none; }

      #panel {
        display: flex;
        flex-direction: column;
        flex: 0 0 auto;
        min-height: 0;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(8px);
        border-top: 1px solid #ffffff1f;
      }

      /* Drag down to give the viewer more room, or tap to collapse. */
      #grip {
        flex: 0 0 auto;
        width: 100%;
        height: 26px;
        padding: 0;
        border-radius: 0;
        background: none;
        touch-action: none;
        cursor: ns-resize;
      }

      #grip::before {
        content: "";
        display: block;
        width: 36px;
        height: 4px;
        margin: 11px auto;
        border-radius: 2px;
        background: var(--muted);
      }

      #panelBody {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 16px calc(12px + env(safe-area-inset-bottom));
      }

      button {
        appearance: none;
        width: 100%;
        padding: 14px;
        font: inherit;
        font-weight: 600;
        color: #06101f;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
      }

      button:disabled { opacity: .5; }

      #capture {
        margin-top: 8px;
        color: var(--fg);
        background: #ffffff1f;
      }

      #editor { margin-top: 10px; }
      #editor[hidden] { display: none; }

      #tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #tools button {
        margin: 0;
        padding: 10px;
        font-size: 13px;
        color: var(--fg);
        background: #ffffff1f;
      }

      #tools label {
        display: flex;
        gap: 6px;
        align-items: center;
        flex: 0 0 auto;
        padding: 10px;
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }

      #edits {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
      }

      #edits li { display: flex; justify-content: space-between; gap: 12px; }
      #edits button {
        width: auto;
        padding: 0 6px;
        font: inherit;
        color: var(--muted);
        background: none;
      }

      #progress {
        height: 4px;
        margin-top: 10px;
        border-radius: 2px;
        background: #ffffff1f;
        overflow: hidden;
      }

      #bar {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width .1s linear;
      }

      #status {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      #status.error { color: var(--bad); }

      #diag {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        color: var(--muted);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #banner {
        flex: 0 0 auto;
        padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(8px);
      }
    </style>
  </head>

  <body>
    <div id="banner">M2 editor — placeholder limits, not medical advice</div>

    <div id="stage">
      <video id="feed" playsinline muted autoplay></video>
      <canvas id="gl"></canvas>
    </div>

    <div id="panel">
      <button id="grip" type="button" aria-expanded="true" aria-controls="panelBody"
              aria-label="Drag to resize the controls, or tap to collapse them"></button>

      <div id="panelBody">
        <button id="start" type="button">Start camera</button>
        <button id="capture" type="button" hidden>Capture face</button>
        <div id="progress" hidden><div id="bar"></div></div>

        <div id="editor" hidden>
          <div id="tools">
            <label><input id="symmetry" type="checkbox" checked /> Symmetry</label>
            <button id="before" type="button">Hold to compare</button>
            <button id="resetAll" type="button">Reset all</button>
          </div>
          <ul id="edits"></ul>
        </div>
        <p id="status">Camera off. Nothing leaves this device.</p>
        <ul id="diag"></ul>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
