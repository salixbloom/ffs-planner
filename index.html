<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>FFS Face Planner</title>

    <!-- No build step: dependencies resolve through this import map. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs"
        }
      }
    </script>

    <style>
      :root {
        --bg: #0b0d10;
        --fg: #e8eaed;
        --muted: #9aa4b2;
        --accent: #5b9cff;
        --bad: #ff6b6b;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        overscroll-behavior: none;
      }

      #stage {
        position: fixed;
        inset: 0;
      }

      /* Camera feed sits behind the WebGL canvas; the canvas is transparent so
         M1 can draw the face mesh registered on top of the video. */
      #feed, #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #feed {
        object-fit: cover;
        transform: scaleX(-1); /* selfie view */
        background: #000;
      }

      #gl { touch-action: none; }

      #panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(8px);
        border-top: 1px solid #ffffff1f;
      }

      button {
        appearance: none;
        width: 100%;
        padding: 14px;
        font: inherit;
        font-weight: 600;
        color: #06101f;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
      }

      button:disabled { opacity: .5; }

      #capture {
        margin-top: 8px;
        color: var(--fg);
        background: #ffffff1f;
      }

      #progress {
        height: 4px;
        margin-top: 10px;
        border-radius: 2px;
        background: #ffffff1f;
        overflow: hidden;
      }

      #bar {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width .1s linear;
      }

      #status {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      #status.error { color: var(--bad); }

      #diag {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        color: var(--muted);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(8px);
      }
    </style>
  </head>

  <body>
    <div id="banner">M1 capture — placeholder limits, not medical advice</div>

    <div id="stage">
      <video id="feed" playsinline muted autoplay></video>
      <canvas id="gl"></canvas>
    </div>

    <div id="panel">
      <button id="start" type="button">Start camera</button>
      <button id="capture" type="button" hidden>Capture face</button>
      <div id="progress" hidden><div id="bar"></div></div>
      <p id="status">Camera off. Nothing leaves this device.</p>
      <ul id="diag"></ul>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
